name: thingsboard-build-and-test.yml
on:
  push:
    branches: [ release-4.2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build project
        run: mvn clean test

name: thingsboard-build-and-test

on:
  push:
    branches: [release-4.2]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx1024m
      NODE_OPTIONS: --max-old-space-size=4096
      SUREFIRE_JAVA_OPTS: "-Xmx1200m -Xss256k -XX:+ExitOnOutOfMemoryError"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # - name: Clean and install
      #  run: mvn clean install -T2 -DskipTests

      - name: run tests
        run: mvn test \
          -pl '!web-ui,!web-ui-microservice' \
          -Dtest='!**/*IT*,!**/*Integration*,!**/*Transport*,!**/*Mqtt*'
